name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  seed-and-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bootstrap checks
        run: make check
